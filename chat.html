<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WineBot Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="app-mode">
    <nav class="app-nav">
        <a href="index.html" class="back-link">← Home</a>
        <div class="app-title">WineBot <span>Workspace</span></div>
        <div class="status">● System Ready</div>
    </nav>

    <main class="chat-container">
        <div id="chat-window" class="chat-window">
            <div class="message bot-msg">
                <div class="avatar">🍷</div>
                <div class="bubble">
                    Hello! I am <strong>WineBot</strong>. I provide context-aware responses regarding American Viticultural Area (AVA) designations based on official final rules. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-pill">
                <input type="text" id="user-input" placeholder="Ask about an AVA (e.g., How many AVAs are in Texas?)" autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <script src="chat.js"></script>
</body>
</html>
